<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRC.Geo — Référence géographique de la RDC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--ink:#15303b;--teal:#1F4E5F;--teal2:#2e7d94;--bg:#f4f7f8;--card:#fff;--line:#dde6e9;--accent:#c8a24a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--teal);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:11.5px;opacity:.75}
  .stats{margin-left:auto;display:flex;gap:14px;font-size:12px}
  .stats b{display:block;font-size:15px}
  main{flex:1;display:flex;min-height:0}
  #side{width:340px;min-width:280px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .searchbox{padding:10px;border-bottom:1px solid var(--line)}
  .searchbox input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .filters{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
  .filters button{flex:1;padding:5px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
  .filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  #list{flex:1;overflow-y:auto}
  .prov{border-bottom:1px solid var(--line)}
  .prov>.phead{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13.5px}
  .prov>.phead:hover{background:#eef4f6}
  .prov .count{font-size:11px;color:#7d939c;font-weight:400}
  .terrs{display:none}
  .prov.open .terrs{display:block}
  .titem{padding:6px 12px 6px 24px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between}
  .titem:hover{background:#eef4f6}
  .titem.ville{color:#7d939c}
  .titem .pop{font-size:11px;color:#9ab0b8}
  #map{flex:1;background:#dfe9ec}
  #detail{width:400px;min-width:320px;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;display:none}
  #detail.show{display:block}
  #detail .dhead{background:var(--teal);color:#fff;padding:14px 16px;position:sticky;top:0}
  #detail .dhead h2{font-size:18px}
  #detail .dhead .tag{display:inline-block;background:var(--accent);color:#232;font-size:10.5px;padding:1px 8px;border-radius:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  #detail .dhead .prv{font-size:12px;opacity:.85;margin-top:3px}
  #detail .close{position:absolute;top:10px;right:12px;color:#fff;background:none;border:none;font-size:18px;cursor:pointer}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
  .kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .kpi .l{font-size:10.5px;color:#7d939c;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-size:16px;font-weight:700;margin-top:2px}
  .kpi .s{font-size:10px;color:#9ab0b8}
  .sec{padding:4px 16px 12px}
  .sec h3{font-size:12px;color:var(--teal2);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 5px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .sec p, .sec li{font-size:12.5px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:#e8f1f4;border:1px solid #cfe0e6;border-radius:12px;padding:2px 9px;font-size:11.5px}
  .note{font-size:10.5px;color:#8fa5ad;padding:10px 16px;border-top:1px solid var(--line)}
  .empty{color:#9ab0b8;font-style:italic;font-size:12px}
  .leaflet-container{background:#dfe9ec}
  @media(max-width:900px){#side{display:none} #detail{position:absolute;right:0;top:52px;bottom:0;z-index:1000}}
</style>
</head>
<body>
<header>
  <div>
    <h1>DRC.Geo</h1>
    <div class="sub">Référence géographique de la République Démocratique du Congo</div>
  </div>
  <div class="stats">
    <div><b>26</b>provinces</div>
    <div><b>145</b>territoires</div>
    <div><b>44</b>villes</div>
    <div><b id="stat-pop">—</b>habitants (proj. 2024)</div>
  </div>
</header>
<main>
  <div id="side">
    <div class="searchbox"><input id="q" type="search" placeholder="Rechercher un territoire, une ville, une province…"></div>
    <div class="filters">
      <button id="f-all" class="on">Tout</button>
      <button id="f-prov">Provinces</button>
      <button id="f-terr">Territoires</button>
      <button id="f-ville">Villes</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
  <div id="detail"></div>
</main>

res premières dans la forêt qui sépare ces deux entités. Et aussi la population du secteur Yoko qui subit les actes de chasseurs braconniers venant du territoire de ","accessibility_tourism":"Accessibilité du territoire Routes Oui Voies aériennes Oui Biefs navigables Oui Train Oui Malgré les 4 voies accessibles citées, actuellement le territoire n'est accessible que par la voie routière et navigable. La principale route qui permet l'entrée et la sortie du territoire c'est la RN6 (qui connecte le territoire d'Aketi au territoire de Buta, et le territoire de Bumba (province de la Mongala). Il y a d'autres routes qui mènent vers le territoire de Bondo, Yakoma (dans le Nord-ubangi) et Ba","caid_updated":"31 mars 2021","has_caid_fiche":true,"type":"territoire"},{"province":"Bas-Uele","name":"Ango","pcode":"CD5207","area_km2_codab":34312.6,"area_km2_caid":null,"population_2024_ocha":126942,"population_caid":null,"population_caid_source":null,"subdivisions":"compte 9 groupements et 26 villages ; La chefferie Sasa (18274km 2 ) qui est la plus grande de toutes, compte 8 groupements et 29 villages.","languages":["Zandé","Sango","Ngwandi","Lingala"],"main_activities":["Agriculture","Chasse","Elevage","Pêche","Petits commerces"],"agricultural_products":["Manioc","Riz","Arachide","Maïs","Banane Plantin"],"health_note":null,"schools_primary":null,"schools_secondary":null,"development_opportunities":"Installation d'un barrage hydroélectrique sur une chute d'eau située à 20km d'Ango dans l'axe Ango-Api. La sécurisation complète et définitive de la zone. Le sous-sol du territoire regorge pas mal des matières précieuses qui sont un peu plus susceptible de pouvoir apporter des ressources nécessaires au développement de ce territoire si elles sont exploitées à bon escient. Nous pensons que l'ouverture et/ou la réhabilitation des routes permettant de relier Ango à des grands centre de débouché serait parmi les opportunités de développement étant donné que cela encouragera les paysans à rait un facteur déclencheur du développement dans le territoire ; Le développement de tourisme en valorisant les divers sites touristiques; La desserte du territoire en électricité, émanant d'une centrale hydroélectrique favoriserait des investissements et l'implantation des usines/industries locales. En effet, les opérateurs économiques du territoire passent leurs commandes avec des usines étrangères (notamment en Oug","security_note":"D'une manière générale, le calme a regné en territoire d'Aru durant toute l'année 2016. La population a vaqué paisiblement à ses occupations habituelles et quotidiennes bien que quelques conflits de terre et des limites administratives ont été signalés.","accessibility_tourism":"Accessibilité du territoire Routes Oui Voies aériennes Oui Biefs navigables Non Train Non Le territoire d'Aru est traversé par les routes à caractère provincial et de desserte agricole. Toutefois, ces routes relient le territoire avec les pays voisins par les frontières OFOO : la frontière Vurra entre la RDC et L'Ouganda et celle de Kengezi-Base entre la RDC et le Soudan du Sud. Ces deux postes d'entrée favorisent ainsi l'importation des produits manufacturés et l'exportation des produits essent","caid_updated":"31 mars 2021","has_caid_fiche":true,"type":"territoire"},{"province":"Tshopo","name":"Bafwasende","pcode":"CD5111","area_km2_codab":48803.6,"area_km2_caid":47087,"population_2024_ocha":209674,"population_caid":602090,"population_caid_source":"Rapport annuel du territoire, exercice 2019","subdivisions":"compte au total 6 secteurs et 33 groupements.","languages":["Swahili","Lingala","Kibali","Kikumu","Kirumbi","Kimbuti"],"main_activities":["Agriculture","Petit commerce","Pêche","Chasse","Elevage"],"agricultural_products":["Riz paddy (43%)","Bananes plantains (31%)","Manioc (22%)","Maïs (3%)","Arachides (1%)"],"health_note":"trois zones de santé","schools_primary":2,"schools_secondary":null,"development_opportunities":"Bafwasende compte 9 territoires voisins, ceci lui permettrait d'entretenir plusieurs échanges commerciaux avec ces derniers ; Il est traversé de l'Ouest vers l'Est par la route Nationale N°4 ; celle-ci représente une grande opportunité qui favoriserait le développement économique du territoire surtout du point de vue écoulement des produits agricoles et non agricoles du territoire. Aussi, grâce au trafic Kisangani-Beni-Butembo-Bunia-Kasindi et inversement, l'approvisionnement régulier du territoire en produits d'importation est assuré ; La mécanisation de la pêche avec strict respect du calend","security_note":"Bafwasende a connu des cas d'affrontement qui ont opposé les miliciens « NDC rénové » à ceux du Major Luc en Juin 2016, dans le secteur d'Angumu, au Sud du territoire. Cette situation a provoqué une vague de déplacement de la population sur l'axe Balobe, Opienge et Bafwabalinga. En Août 2016, MSF a identifié jusqu'à 28.580 déplacés sur cet axe. Depuis Novembre 2016, une réponse d'urgence a été lan","accessibility_tourism":"Accessibilité du territoire Routes Oui Voies aériennes Non Biefs navigables Non Train Non Le territoire de Bafwasende est principalement accessible par voie routière. Il est traversé par la RN4 le reliant à Ubundu et ville de Kisangani (à l'ouest) et au territoire de Mambasa vers l'Est, en traversant la rivière Ituri. Ici, la totalité de routes secondaires menant dans différents villages sont dans une impraticabilité très avancée entrainant le quasi enclavement de ces derniers avec toutes les co","caid_updated":"31 mars 2021","has_caid_fiche":true,"type":"territoire"},{"province":"Kwilu","name":"Bagata","pcode":"CD3202","area_km2_codab":17238.7,"area_km2_caid":18179,"population_2024_ocha":747732,"population_caid":1884495,"population_caid_source":"Administrateur du territoire","subdivisions":"compte 1127 écoles dont 61 écoles pré-primaires et 1066(primaires et secondaires) reparties dans les cinq secteurs du territoire.","languages":["Kikongo (59%)","kiyanzi (18%)","Lingala (10%)","Le Mbala (3%)","Le teke (2,5%)"],"main_activities":["Agriculture (87,3%)","Petit commerce (5,7%)","Elevage (5%)","Pèche (1,6%)","Cueillette (0,4%)"],"agricultural_products":["Manioc (91,1%)","Arachide (4,50%)","Mais (1,8%)","Patate douce (0,50%)","Niébé (0,48%)"],"health_note":"trois Zones de santé","schools_primary":null,"schools_secondary":null,"development_opportunities":"Plusieurs secteurs de développement dans le territoire de Bagata ne sont pas exploités et ceux qui les sont, les portions n'atteignent mêmes pas 30%. Donc, dans le cas d'espèce, le territoire renferme beaucoup d'opportunités. La grande saison sèche s'intercale entre Mai et Août (septembre), la petite saison sèche quant à elle de janvier à février ; la grande saison pluvieuse entre le mois de septembre et décembre : la température variant entre 24 à 25 °C et de 27 à 35°C pendant la saison sèche. Dans le cadre de l'agriculture, pèche et élevage ; le territoire de Bagata est dominé par le sol arg","security_note":"A part quelques cas de criminalité fréquentés enregistrent au chef de certains groupement àconflit, du reste, le territoire de Bagata est en parfaite tranquillité.","accessibility_tourism":"Accessibilité du territoire Routes Oui Voies aériennes Oui Biefs navigables Oui Train Non L'accèss au territoire de Bagata se fait soit par voies routières soit par voies aériennes et soit par les biefs navigables. De Bandundu vers la Commune de Bagata, cette route est réhabilitée par la CTB et, est dans bon état à l'absence de la pluie mais aussi sa largeur ne laisserait pas passée aisément deux gros véhicules. Cet axe mène du sud de Bagata vers Nto, après passage du bac pour longer d'abord le ","caid_updated":"31 mars 2021","has_caid_fiche":true,"type":"territoire"},{"province":"Bas-Uele","name":"Bambesa","pcode":"CD5209","area_km2_codab":9871.2,"area_km2_caid":9130,"population_2024_ocha":152521,"population_caid":232977,"population_caid_source":"Rapport annuel du territoire de bambesa, 2020.", 205","area_km2_codab":1635.4,"area_km2_caid":1747,"population_2024_ocha":315462,"population_caid":984703,"population_caid_source":"Rapport annuel 2020 du territoire","subdivisions":"compte 37 groupements et 467 villages.","languages":["Tshiluba","Lingala","Swahili"],"main_activities":["Agriculture","Petit commerce","Exploitation de diamant artisanal","Elevage"],"agricultural_products":["Manioc","MaÏs","Niébé","Arachide","Soja"],"health_note":"deux zones de santé","schools_primary":82,"schools_secondary":34,"development_opportunities":"Le territoire de Miabi est une entité agro-pastorale disposant de vastes étendues de terres arables pour la production vivrière, maraîchère et pérenne, et des plaines et plateaux favorables à l'élevage du gros et petit bétail. Mais l'attrait de l'exploitation artisanale du diamant a provoqué un important mouvement des populations vers des centres d'exploitation du diamant, et par conséquent, la population jeune a tendance à abandonner des activités agricoles rendant ainsi le territoire dépendante des autres territoires pour certains besoins alimentaires. Jadis, le territoire garde des potentia","security_note":"La situation sécuritaire dans le territoire de Miabi est relativement calme sauf quelques conflits de pouvoir coutumier dans le groupement de Bena Tshimbu et Bashi Ngala.","accessibility_tourism":"Accessibilité du territoire Routes Oui Voies aériennes Non Biefs navigables Non Train Non L'accès au territoire de Miabi se fait uniquement par voies routières mais des routes non asphaltées. La route permettant d'entrer et de sortir du territoire est une route provinciale qui quitte Mbujimayi passe par la cité de Boya se dirige vers le territoire voisin de Kamiji et va jusqu'à Mweneditu, l'on constate que c'est une route en terre bâtie et en délabrement très avancé. Seulement le tronçon Mbujima","caid_updated":"31 mars 2021","has_caid_fiche":true,"type":"territoire"},{"province":"Haut-Katanga","name":"Mitwaba","pcode":"CD7108","area_k const byPcode = {}; UNITS.forEach(u => byPcode[u.pcode] = u);
const fmt = n => n == null ? '—' : n.toLocaleString('fr-FR');
document.getElementById('stat-pop').textContent = (UNITS.reduce((s,u)=>s+(u.population_2024_ocha||0),0)/1e6).toFixed(1)+' M';

// ---------- map ----------
const map = L.map('map', {zoomSnap:.25}).setView([-2.9, 23.6], 5.25);
const provColors = {};
const palette = ['#2e7d94','#c8a24a','#7b9e6b','#a2666f','#5b7fa6','#b07d4f','#6d8f8a','#96729e'];
let ci = 0;
function colorFor(prov){ if(!provColors[prov]) provColors[prov] = palette[ci++ % palette.length]; return provColors[prov]; }

let selectedLayer = null;
const layerByPcode = {};
const gj = L.geoJSON(GEO, {
  style: f => {
    const u = byPcode[f.properties.p] || {};
    return {color:'#ffffff', weight:.7, fillColor: colorFor(u.province||'?'), fillOpacity: u.type==='ville'? .95 : .55};
  },
  onEachFeature: (f, layer) => {
    const u = byPcode[f.properties.p];
    if (!u) return;
    layerByPcode[u.pcode] = layer;
    layer.bindTooltip(`${u.name} (${u.province})`, {sticky:true});
    layer.on('click', () => openDetail(u.pcode, false));
    layer.on('mouseover', () => layer.setStyle({weight:2, color:'#1F4E5F'}));
    layer.on('mouseout', () => { if(layer!==selectedLayer) gj.resetStyle(layer); });
  }
}).addTo(map);
map.fitBounds(gj.getBounds(), {padding:[10,10]});

// ---------- sidebar ----------
let filter = 'all';
function buildList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const el = document.getElementById('list');
  if (filter === 'prov'){
    el.innerHTML = '';
    PROVINCES.filter(p => !q || p.name.toLowerCase().includes(q) || (p.capital||'').toLowerCase().includes(q))
      .sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(p => {
        const it = document.createElement('div');
        it.className = 'titem';
        it.style.padding = '9px 12px';
        it.style.fontWeight = '600';
        it.innerHTML = `<span>${p.name}</span><span class="pop">${fmt(p.population_2024_est)}</span>`;
        it.onclick = () => openProvince(p.name);
        el.appendChild(it);
      });
    return;
  }
  const provs = {};
  UNITS.forEach(u => {
    if (filter==='terr' && u.type!=='territoire') return;
    if (filter==='ville' && u.type!=='ville') return;
    if (q && !(u.name.toLowerCase().includes(q) || u.province.toLowerCase().includes(q))) return;
    (provs[u.province] = provs[u.province] || []).push(u);
  });
  el.innerHTML = '';
  Object.keys(provs).sort().forEach(p => {
    const div = document.createElement('div');
    div.className = 'prov' + (q ? ' open' : '');
    const units = provs[p].sort((a,b)=>a.name.localeCompare(b.name));
    div.innerHTML = `<div class="phead"><span>${p}</span><span class="count">${units.length}</span></div>`;
    const td = document.createElement('div');
    td.className = 'terrs';
    units.forEach(u => {
      const it = document.createElement('div');
      it.className = 'titem' + (u.type==='ville' ? ' ville' : '');
      it.innerHTML = `<span>${u.name}${u.type==='ville'?' ⌂':''}</span><span class="pop">${u.population_2024_ocha?fmt(u.population_2024_ocha):''}</span>`;
      it.onclick = () => openDetail(u.pcode, true);
      td.appendChild(it);
    });
    div.appendChild(td);
    div.querySelector('.phead').onclick = () => div.classList.toggle('open');
    el.appendChild(div);
  });
}
document.getElementById('q').addEventListener('input', buildList);
['all','prov','terr','ville'].forEach(f => {
  document.getElementById('f-'+f).onclick = e => {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');
    buildList();
  };
});
buildList();

// ---------- detail ----------
function chips(arr){ return arr && arr.length ? `<div class="chips">${arr.map(x=>`<span class="chip">${x}</span>`).join('')}</div>` : '<p class="empty">Donnée non disponible</p>'; }
function para(t){ return t ? `<p>${t}</p>` : '<p class="empty">Donnée non disponible</p>'; }

function openDetail(pcode, zoom){
  const u = byPcode[pcode];
  if (!u) return;
  const provInfo = PROVINCES.find(p => p.name.normalize('NFD').replace(/[^a-zA-Z]/g,'').toLowerCase() === u.province.normalize('NFD').replace(/[^a-zA-Z]/g,'').toLowerCase());
  const d = document.getElementById('detail');
  d.className = 'show';
  d.innerHTML = `
    <div class="dhead">
      <button class="close" onclick="closeDetail()">✕</button>
      <h2>${u.name}</h2>
      <span class="tag">${u.type}</span>
      <div class="prv">Province : ${u.province}${provInfo ? ' · Chef-lieu provincial : '+provInfo.capital : ''}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Superficie</div><div class="v">${fmt(u.area_km2_codab)} km²</div><div class="s">UN COD-AB${u.area_km2_caid ? ' · CAID: '+fmt(u.area_km2_caid)+' km²' : ''}</div></div>
      <div class="kpi"><div class="l">Population 2024</div><div class="v">${fmt(u.population_2024_ocha)}</div><div class="s">projection OCHA${u.population_caid ? ' · CAID: '+fmt(u.population_caid) : ''}</div></div>
    </div>
    <div class="sec">
      <h3>Langues</h3>${chips(u.languages)}
      <h3>Activités principales</h3>${chips(u.main_activities)}
      <h3>Produits agricoles</h3>${chips(u.agricultural_products)}
      <h3>Éducation</h3>${(u.schools_primary||u.schools_secondary) ? `<p>${u.schools_primary||'?'} écoles primaires · ${u.schools_secondary||'?'} écoles secondaires</p>` : '<p class="empty">Donnée non disponible</p>'}
      <h3>Santé</h3>${para(u.health_note)}
      <h3>Subdivisions</h3>${para(u.subdivisions)}
      <h3>Opportunités de développement</h3>${para(u.development_opportunities)}
      <h3>Accessibilité &amp; tourisme</h3>${para(u.accessibility_tourism)}
      ${u.security_note ? '<h3>Situation sécuritaire (note CAID, avant 2022)</h3>'+para(u.security_note) : ''}
      ${provInfo ? `<h3>Contexte provincial (${u.province})</h3>
        <p><b>Ressources :</b> ${provInfo.natural_resources}</p>
        <p><b>Économie :</b> ${provInfo.economy_specialties}</p>
        <p><b>Particularités :</b> ${provInfo.particularities}</p>
        <p><b>Éducation :</b> ${provInfo.education}</p>` : ''}
    </div>
    <div class="note">Sources : fiches CAID (Primature RDC, 2019-2021) · OCHA HPC 2024 · UN COD-AB. Dernier recensement national : 1984 — toutes les populations sont des projections.${u.caid_updated ? ' Fiche CAID mise à jour : '+u.caid_updated+'.' : ''}</div>`;
  // highlight on map
  clearProvHighlight();
  if (selectedLayer) gj.resetStyle(selectedLayer);
  const layer = layerByPcode[pcode];
  if (layer){
    selectedLayer = layer;
    layer.setStyle({weight:2.5, color:'#c8a24a'});
    if (zoom) map.fitBounds(layer.getBounds(), {padding:[40,40], maxZoom:8});
  }
  d.scrollTop = 0;
}
function closeDetail(){
  document.getElementById('detail').className = '';
  if (selectedLayer){ gj.resetStyle(selectedLayer); selectedLayer = null; }
  clearProvHighlight();
}

// ---------- province view ----------
let provLayers = [];
function clearProvHighlight(){
  provLayers.forEach(l => gj.resetStyle(l));
  provLayers = [];
}
function openProvince(name){
  const p = PROVINCES.find(x => x.name === name);
  if (!p) return;
  const units = UNITS.filter(u => u.province.normalize('NFD').replace(/[^a-zA-Z]/g,'').toLowerCase() === name.normalize('NFD').replace(/[^a-zA-Z]/g,'').toLowerCase());
  const terrs = units.filter(u => u.type === 'territoire');
  const villes = units.filter(u => u.type === 'ville');
  const popSum = units.reduce((s,u)=>s+(u.population_2024_ocha||0),0);
  const d = document.getElementById('detail');
  d.className = 'show';
  d.innerHTML = `
    <div class="dhead">
      <button class="close" onclick="closeDetail()">✕</button>
      <h2>${p.name}</h2>
      <span class="tag">province</span>
      <div class="prv">Chef-lieu : ${p.capital} · ${terrs.length} territoires${villes.length ? ' · '+villes.length+' villes' : ''} · Ancienne province : ${p.former_province}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Superficie</div><div class="v">${fmt(p.area_km2)} km²</div><div class="s">INS 2020</div></div>
      <div class="kpi"><div class="l">Population 2024</div><div class="v">${fmt(p.population_2024_est)}</div><div class="s">projection OCHA · densité ${p.density_per_km2}/km²</div></div>
    </div>
    <div class="sec">
      <h3>Langues</h3>
      <p><b>Nationale(s) :</b> ${p.national_languages} · <b>Locales :</b> ${p.local_languages}</p>
      <h3>Ressources naturelles</h3>${para(p.natural_resources)}
      <h3>Économie &amp; spécialités</h3>${para(p.economy_specialties)}
      <h3>Particularités</h3>${para(p.particularities)}
      <h3>Éducation</h3>${para(p.education)}
      <h3>Territoires (${terrs.length})</h3>
      <div class="chips">${terrs.sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<span class="chip" style="cursor:pointer" onclick="openDetail('${t.pcode}', true)">${t.name}</span>`).join('')}</div>
      ${villes.length ? `<h3>Villes (${villes.length})</h3>
      <div class="chips">${villes.sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<span class="chip" style="cursor:pointer" onclick="openDetail('${t.pcode}', true)">${t.name}</span>`).join('')}</div>` : ''}
    </div>
    <div class="note">Sources : INS Annuaire Statistique 2020 · OCHA HPC 2024 · compilation DRC.Geo. Dernier recensement national : 1984 — toutes les populations sont des projections.</div>`;
  // highlight all units of the province on the map + zoom
  if (selectedLayer){ gj.resetStyle(selectedLayer); selectedLayer = null; }
  clearProvHighlight();
  let bounds = null;
  units.forEach(u => {
    const layer = layerByPcode[u.pcode];
    if (layer){
      layer.setStyle({weight:2, color:'#c8a24a', fillOpacity:.75});
      provLayers.push(layer);
      bounds = bounds ? bounds.extend(layer.getBounds()) : L.latLngBounds(layer.getBounds().getSouthWest(), layer.getBounds().getNorthEast());
    }
  });
  if (bounds) map.fitBounds(bounds, {padding:[30,30]});
  d.scrollTop = 0;
}
</script>
</body>
</html>
